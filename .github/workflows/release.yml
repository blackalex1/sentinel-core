name: Release Sentinel-Core Engine

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.0.1-beta)'
        required: true
        default: 'v0.0.1-beta'

permissions:
  contents: write

jobs:
  # 1. Strict test suite execution with Go race detector
  test:
    name: 🧪 Run Unit & Integration Tests (Go Race Detector)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run Full Test Suite (Multi-threaded & Parallel)
        run: |
          CPU_COUNT=$(nproc 2>/dev/null || echo 4)
          echo "Running test suite with ${CPU_COUNT} parallel worker threads..."
          go test -v -race -p "${CPU_COUNT}" -parallel "${CPU_COUNT}" ./...

  # 2. Multi-platform cross-compilation (Server, Desktop, Mobile/Android) and release publishing
  build-and-release:
    name: 🚀 Cross-Compile & Publish Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install cross-compilers for Linux/Windows FFI
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64

      - name: Determine Release Version
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW_VER="${{ github.event.inputs.version }}"
          else
            RAW_VER="${GITHUB_REF#refs/tags/}"
          fi
          
          CLEAN_VER="${RAW_VER#v}"
          
          echo "TAG_NAME=${RAW_VER}" >> $GITHUB_OUTPUT
          echo "VERSION=${CLEAN_VER}" >> $GITHUB_OUTPUT

          if [[ "$RAW_VER" =~ (beta|alpha|rc|dev|pre) ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
            echo "MAKE_LATEST=false" >> $GITHUB_OUTPUT
            echo "Publishing PRE-RELEASE: tag=${RAW_VER}, version=${CLEAN_VER}"
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
            echo "MAKE_LATEST=true" >> $GITHUB_OUTPUT
            echo "Publishing STABLE RELEASE: tag=${RAW_VER}, version=${CLEAN_VER}"
          fi

      - name: Parallel Cross-Compile CLI Binaries (Linux, Windows, macOS)
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X main.Version=${{ steps.vars.outputs.VERSION }}"
          pids=()

          build_cli() {
            local os="$1"
            local arch="$2"
            local out="$3"
            echo "⏳ [START] CLI ${os}/${arch} -> ${out}"
            if CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -ldflags="$LDFLAGS" -o "${out}" ./cmd/cli; then
              echo "✅ [DONE]  CLI ${os}/${arch} -> ${out}"
            else
              echo "❌ [FAIL]  CLI ${os}/${arch} -> ${out}" >&2
              return 1
            fi
          }

          # Spawn all CLI targets concurrently
          build_cli "linux" "amd64" "dist/sentinel-core-linux-amd64" &
          pids+=($!)

          build_cli "linux" "arm64" "dist/sentinel-core-linux-arm64" &
          pids+=($!)

          build_cli "windows" "amd64" "dist/sentinel-core-windows-amd64.exe" &
          pids+=($!)

          build_cli "windows" "arm64" "dist/sentinel-core-windows-arm64.exe" &
          pids+=($!)

          build_cli "darwin" "amd64" "dist/sentinel-core-darwin-amd64" &
          pids+=($!)

          build_cli "darwin" "arm64" "dist/sentinel-core-darwin-arm64" &
          pids+=($!)

          # Wait for all background builds to complete
          failed=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              failed=1
            fi
          done

          if [ $failed -ne 0 ]; then
            echo "❌ Parallel CLI cross-compilation encountered errors!" >&2
            exit 1
          fi

      - name: Parallel Cross-Compile C-Shared FFI / JNI Libraries (Linux, Windows, Android)
        run: |
          LDFLAGS="-s -w -X main.Version=${{ steps.vars.outputs.VERSION }}"
          pids=()

          build_cshared() {
            local desc="$1"
            shift
            echo "⏳ [START] FFI ${desc}"
            if "$@"; then
              echo "✅ [DONE]  FFI ${desc}"
            else
              echo "❌ [FAIL]  FFI ${desc}" >&2
              return 1
            fi
          }

          # Linux amd64 shared library
          build_cshared "Linux amd64 .so" env CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -buildmode=c-shared -ldflags="$LDFLAGS" -o dist/libsentinel-core-linux-amd64.so ./cmd/cshared &
          pids+=($!)

          # Linux arm64 shared library
          build_cshared "Linux arm64 .so" env CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -buildmode=c-shared -ldflags="$LDFLAGS" -o dist/libsentinel-core-linux-arm64.so ./cmd/cshared &
          pids+=($!)

          # Windows amd64 DLL
          build_cshared "Windows amd64 .dll" env CC=x86_64-w64-mingw32-gcc CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -buildmode=c-shared -ldflags="$LDFLAGS" -o dist/sentinel-core-windows-amd64.dll ./cmd/cshared &
          pids+=($!)

          # Locate Android NDK for Android compilation
          if [ -n "$ANDROID_NDK_ROOT" ] && [ -d "$ANDROID_NDK_ROOT" ]; then
            NDK="$ANDROID_NDK_ROOT"
          elif [ -n "$ANDROID_NDK_LATEST_HOME" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK="$ANDROID_NDK_LATEST_HOME"
          elif [ -d "/usr/local/lib/android/sdk/ndk" ]; then
            NDK=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          fi

          if [ -n "$NDK" ] && [ -d "$NDK" ]; then
            echo "Found Android NDK at $NDK"
            TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

            # Android C-Shared Libraries (.so) with 16 KB page size alignment (Android 15+ compatible)
            build_cshared "Android arm64 .so" env CC="$TOOLCHAIN/aarch64-linux-android24-clang" CGO_ENABLED=1 GOOS=android GOARCH=arm64 go build -buildmode=c-shared -ldflags="$LDFLAGS -extldflags '-Wl,-z,max-page-size=16384'" -o dist/libsentinel-core-android-arm64.so ./cmd/cshared &
            pids+=($!)

            build_cshared "Android armv7 .so" env CC="$TOOLCHAIN/armv7a-linux-androideabi24-clang" CGO_ENABLED=1 GOOS=android GOARCH=arm go build -buildmode=c-shared -ldflags="$LDFLAGS -extldflags '-Wl,-z,max-page-size=16384'" -o dist/libsentinel-core-android-arm.so ./cmd/cshared &
            pids+=($!)

            build_cshared "Android x86_64 .so" env CC="$TOOLCHAIN/x86_64-linux-android24-clang" CGO_ENABLED=1 GOOS=android GOARCH=amd64 go build -buildmode=c-shared -ldflags="$LDFLAGS -extldflags '-Wl,-z,max-page-size=16384'" -o dist/libsentinel-core-android-x86_64.so ./cmd/cshared &
            pids+=($!)

            # Android CLI Binaries
            build_cshared "Android arm64 CLI" env CC="$TOOLCHAIN/aarch64-linux-android24-clang" CGO_ENABLED=1 GOOS=android GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/sentinel-core-android-arm64 ./cmd/cli &
            pids+=($!)

            build_cshared "Android armv7 CLI" env CC="$TOOLCHAIN/armv7a-linux-androideabi24-clang" CGO_ENABLED=1 GOOS=android GOARCH=arm go build -ldflags="$LDFLAGS" -o dist/sentinel-core-android-arm ./cmd/cli &
            pids+=($!)

            build_cshared "Android x86_64 CLI" env CC="$TOOLCHAIN/x86_64-linux-android24-clang" CGO_ENABLED=1 GOOS=android GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/sentinel-core-android-x86_64 ./cmd/cli &
            pids+=($!)
          else
            echo "Android NDK not found on runner, skipping Android builds"
          fi

          # Wait for all background builds to complete
          failed=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              failed=1
            fi
          done

          cp dist/libsentinel-core-linux-amd64.h dist/sentinel-core.h 2>/dev/null || true

          if [ $failed -ne 0 ]; then
            echo "❌ Parallel C-Shared / FFI cross-compilation encountered errors!" >&2
            exit 1
          fi

          ls -lh dist/

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: Sentinel-Core ${{ steps.vars.outputs.TAG_NAME }}
          make_latest: ${{ steps.vars.outputs.MAKE_LATEST }}
          draft: false
          prerelease: ${{ steps.vars.outputs.IS_PRERELEASE == 'true' }}
          generate_release_notes: true
          files: |
            dist/sentinel-core-linux-amd64
            dist/sentinel-core-linux-arm64
            dist/sentinel-core-windows-amd64.exe
            dist/sentinel-core-windows-arm64.exe
            dist/sentinel-core-darwin-amd64
            dist/sentinel-core-darwin-arm64
            dist/sentinel-core-android*
            dist/libsentinel-core-linux-amd64.so
            dist/libsentinel-core-linux-arm64.so
            dist/libsentinel-core-android*
            dist/sentinel-core-windows-amd64.dll
            dist/sentinel-core.h
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
