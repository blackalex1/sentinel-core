name: CI Automated Tests

on:
  push:
    branches:
      - main
      - dev
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    name: 🧪 Go Race Tests & Compilation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Run Tests with Race Detector (Multi-threaded & Parallel)
        run: |
          CPU_COUNT=$(nproc 2>/dev/null || echo 4)
          echo "Running test suite with ${CPU_COUNT} parallel worker threads..."
          go test -v -race -p "${CPU_COUNT}" -parallel "${CPU_COUNT}" ./...

      - name: Verify CLI Compilation
        run: go build -v -o /dev/null ./cmd/cli

      - name: Verify C-Shared Compilation
        run: go build -buildmode=c-shared -v -o /dev/null ./cmd/cshared
